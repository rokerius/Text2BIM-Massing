name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,llm,mesh,maslov]'
      - run: python -m pip check
      - run: ruff check src tests examples tools integrations
      - run: ruff format --check src tests examples tools integrations
      - run: python tools/audit_adaptation.py --check
      - run: python -m pytest -c pyproject.toml tests -q
      - run: python -m build
      - run: python examples/scene_without_llm.py > /tmp/massing.json
